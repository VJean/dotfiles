---
- name: Setup developer machine
  hosts: all
  gather_facts: true

  vars:
    dotfiles_repo: https://github.com/VJean/dotfiles.git
    dotfiles_dir: "{{ ansible_facts['env'].HOME }}/dotfiles"
    stow_packages:
      - nvim
      - ohmyzsh
      - tmux
      - vim

  tasks:
    - name: Install packages (macOS via Homebrew)
      community.general.homebrew:
        name:
          - stow
          - bat
          - ripgrep
          - fzf
          - neovim
          - fd
          - tree-sitter-cli
          - zoxide
          - jq
        state: present
      when: ansible_facts["os_family"] == "Darwin"

    - name: Install packages (Ubuntu/Debian via apt)
      ansible.builtin.apt:
        name:
          - stow
          - bat
          - ripgrep
          - fzf
          - neovim
          - fd-find
          - jq
        state: present
        update_cache: true
      become: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install zoxide (Ubuntu/Debian via script)
      ansible.builtin.shell:
        cmd: "curl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh"
        creates: "{{ ansible_facts['env'].HOME }}/.local/bin/zoxide"
      when: ansible_facts["os_family"] == "Debian"

    - name: Check if dotfiles directory exists
      ansible.builtin.stat:
        path: "{{ dotfiles_dir }}"
      register: dotfiles_stat

    - name: Clone dotfiles
      ansible.builtin.git:
        repo: "{{ dotfiles_repo }}"
        dest: "{{ dotfiles_dir }}"
      when: not dotfiles_stat.stat.exists

    - name: Stow dotfiles packages
      ansible.builtin.command:
        cmd: "stow {{ stow_packages | join(' ') }}"
        chdir: "{{ dotfiles_dir }}"
      changed_when: false

- name: Setup local machine
  hosts: local
  gather_facts: true

  vars:
    dotfiles_dir: "{{ ansible_facts['env'].HOME }}/dotfiles"
    local_stow_packages:
      - kitty

  tasks:
    - name: Install kitty (macOS via Homebrew Cask)
      community.general.homebrew_cask:
        name: kitty
        state: present
      when: ansible_facts["os_family"] == "Darwin"

    - name: Install kitty (Ubuntu/Debian via apt)
      ansible.builtin.apt:
        name: kitty
        state: present
        update_cache: true
      become: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Stow local dotfiles packages
      ansible.builtin.command:
        cmd: "stow {{ local_stow_packages | join(' ') }}"
        chdir: "{{ dotfiles_dir }}"
      changed_when: false

    - name: Stow macOS-only dotfiles packages (theme sync script)
      ansible.builtin.command:
        cmd: "stow macos"
        chdir: "{{ dotfiles_dir }}"
      changed_when: false
      when: ansible_facts["os_family"] == "Darwin"

    - name: Render theme-sync LaunchAgent for this machine's home directory
      ansible.builtin.template:
        src: templates/com.jean.theme-sync.plist.j2
        dest: "{{ ansible_facts['env'].HOME }}/Library/LaunchAgents/com.jean.theme-sync.plist"
      register: theme_sync_plist
      when: ansible_facts["os_family"] == "Darwin"

    - name: Unload theme-sync LaunchAgent (ignore if not currently loaded)
      ansible.builtin.command:
        cmd: "launchctl unload {{ ansible_facts['env'].HOME }}/Library/LaunchAgents/com.jean.theme-sync.plist"
      changed_when: false
      failed_when: false
      when: ansible_facts["os_family"] == "Darwin" and theme_sync_plist.changed

    - name: Load theme-sync LaunchAgent
      ansible.builtin.command:
        cmd: "launchctl load {{ ansible_facts['env'].HOME }}/Library/LaunchAgents/com.jean.theme-sync.plist"
      changed_when: false
      failed_when: false
      when: ansible_facts["os_family"] == "Darwin" and theme_sync_plist.changed
