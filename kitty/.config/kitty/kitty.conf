# kitty
# minimal setup. tmux is the real UI.

# Font: plain (unpatched) MesloLG S.
# Nerd Font icons don't need a patched font: kitty ships the Nerd Font
# symbols built-in and falls back to them automatically.
font_family      MesloLG S
font_size        14.0
# disable_ligatures always

# Window
remember_window_size  no
initial_window_width  135c
initial_window_height 45c

background_opacity 0.90
background_blur 50
dynamic_background_opacity yes

# macOS
# send ESC+letter for Alt+letter (shell word-jump bindings:
# Alt+f/b/j/k/h/l/c).
macos_option_as_alt yes
macos_titlebar_color background
# quit when all windows are closed
macos_quit_when_last_window_closed yes

# Light/dark theming: kitty auto-loads dark-theme.auto.conf or
# light-theme.auto.conf (picked by filename, no include needed here)
# and follows macOS appearance live. When it flips, kitty reports the
# color scheme change (DEC mode 2031) to programs — tmux 3.7 relays
# that to panes.

# Launch tmux on startup. Absolute path because GUI
# apps don't inherit the Homebrew PATH.
startup_session ~/.config/kitty/sessions/tmux.conf
